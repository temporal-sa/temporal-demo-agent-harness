# Agents the UI can launch. The web server reads this file at startup and replaces each
# task_queue with the configured TEMPORAL_TASK_QUEUE, so a crashable workspace starts
# agents on its own queue. To expose a new agent, register its workflow on the worker
# and add an [[agents]] entry here.

[[agents]]
key = "ziggy-chat"
workflow_type = "ZiggyChatAgent"
agent = "agent_harness_demo.ziggy.conversational_workflow:ZiggyChatAgentWorkflow"
task_queue = "agent-harness"
label = "Ziggy (Conversational)"
description = """
A conversational travel-booking assistant. Chat in plain text; an LLM converses to
gather your trip details, then WRITES its own pydantic-monty Python script and runs
it via a tool to orchestrate durable flight/hotel search + booking activities,
replying with the results."""

[[agents]]
key = "ziggy-chat-subagent"
workflow_type = "ZiggyChatSubagentAgent"
agent = "agent_harness_demo.ziggy.conversational_subagent_workflow:ZiggyChatSubagentWorkflow"
task_queue = "agent-harness"
label = "Ziggy (Conversational, Subagent)"
description = """
Same conversational travel-booking experience as Ziggy (Conversational), but instead
of running its Python scripts inline it drives the barebones Ziggy (Dynamic) agent as
a SUBAGENT — starting a script-runner instance and sending it each script over the
harness subagent toolset. The first end-to-end demo of agents-as-subagents."""
