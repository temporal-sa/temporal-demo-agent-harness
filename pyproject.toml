[project]
name = "temporal-demo-agent-harness"
version = "0.1.0"
description = "Ziggy, a durable travel agent on the Temporal Agent Harness, packaged for the tmprl-demo.cloud catalog."
requires-python = ">=3.12"
dependencies = [
    "temporal-agent-harness[genai,code-mode,ui,s3]==0.6.0",
    # The harness's Gemini plugin imports google.genai._interactions, which 2.9.0 removed.
    # The harness only asks for >=2.0.0; this matches the 2.8.0 its own lockfile tests.
    "google-genai>=2.8,<2.9",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.27",
    "jsonpatch>=1.33",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
